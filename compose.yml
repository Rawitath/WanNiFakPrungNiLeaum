services:
  frontend:
    profiles: ["prod"]
    image: wannifakprungnileaum-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 8081:8081
  frontend-dev:
    profiles: ["dev"]
    image: wannifakprungnileaum-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/my-app:/app
      - /app/node_modules
      - /app/.expo
    environment:
      - BROWSER=none
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - FAST_REFRESH=true
    ports:
      - 8081:8081
    networks:
      - stayforget-network
    stdin_open: true
    tty: true
  backend:
    profiles: ["prod"]
    image: wannifakprungnileaum-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 3000:3000
  backend-dev:
    profiles: ["dev"]
    image: wannifakprungnileaum-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend/src:/app/src
    ports:
      - 3000:3000
    networks:
      - stayforget-network

networks:
  stayforget-network:
    driver: bridge
