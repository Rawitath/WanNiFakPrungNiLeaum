services:
  frontend:
    profiles: ["", "prod", "frontend"]
    restart: unless-stopped
    image: wannifakprungnileaum-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:3000
      - API_URL=http://localhost:3000
    networks:
      - stayforget-network

  frontend-dev:
    profiles: ["dev", "dev-frontend"]
    restart: on-failure
    image: wannifakprungnileaum-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/my-app:/app
      - /app/node_modules
      - /app/.expo
    environment:
      - BROWSER=none
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - FAST_REFRESH=true
      - EXPO_PUBLIC_API_URL=http://localhost:3000
      - API_URL=http://localhost:3000
    ports:
      - "8081:8081"
    networks:
      - stayforget-network
    stdin_open: true
    tty: true

  backend:
    profiles: ["", "prod", "backend"]
    image: wannifakprungnileaum-backend:latest
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8081/api/oauth/google/callback}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-none}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-none}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-stayforget}
      DB_USER: ${POSTGRES_USER:-stayforget}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aa1234}
      JWT_SECRET: ${JWT_SECRET:-secret123}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
      PASSWORD_ENDEC_SALT: ${PASSWORD_ENDEC_SALT:-saltSALT}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      ADMIN_PHONE: ${ADMIN_PHONE:-0899999999}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - stayforget-network

  backend-test:
    profiles: ["test", "test-backend"]
    image: wannifakprungnileaum-backend:test
    restart: on-failure
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    environment:
      OAUTH_REDIRECT_URI: 'http://backend-test:3000/api/oauth/google/callback'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      PASSWORD_ENDEC_SALT: ${PASSWORD_ENDEC_SALT}
      NODE_ENV: test
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stayforget-network

  backend-dev:
    profiles: ["dev", "dev-backend"]
    image: wannifakprungnileaum-backend:dev
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      OAUTH_REDIRECT_URI: 'http://backend-dev:3000/api/oauth/google/callback'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      DB_HOST: db-dev
      DB_PORT: 5432
      DB_NAME: dev
      DB_USER: dev
      DB_PASSWORD: aa1234
      JWT_SECRET: secret123
      JWT_EXPIRATION: 1h
      PASSWORD_ENDEC_SALT: saltSALT
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@test.com
      ADMIN_PASSWORD: admin1234
      ADMIN_PHONE: 0888888888
    volumes:
      - ./backend/src:/app/src
    ports:
      - "3000:3000"
    depends_on:
      - db-dev
    networks:
      - stayforget-network

  db:
    image: postgres:18-alpine
    profiles: ["", "prod", "test", "backend"]
    restart: unless-stopped
    volumes:
      - stayforget_db:/var/lib/postgresql
      - ./init-scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stayforget}
      POSTGRES_USER: ${POSTGRES_USER:-stayforget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aa1234}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-stayforget} -d $${POSTGRES_DB:-stayforget}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - stayforget-network

  db-dev:
    image: postgres:18-alpine
    profiles: ["dev", "dev-backend"]
    restart: on-failure
    volumes:
      - stayforget_dev_db:/var/lib/postgresql
      - ./init-scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    environment:
      POSTGRES_DB: dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: aa1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - stayforget-network

volumes:
  stayforget_db:
  stayforget_dev_db:

networks:
  stayforget-network:
    driver: bridge
